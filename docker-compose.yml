version: '3.8'

services:
  # 1. PostgreSQL with PostGIS Spatial Extension
  postgres:
    image: postgis/postgis:15-3.3
    container_name: wien_heute_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vienna_events
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vienna_events"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. NestJS Backend REST API (Port 3000)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: wien_heute_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vienna_events?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Next.js PWA Frontend Application (Port 3001)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    container_name: wien_heute_frontend
    restart: always
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
