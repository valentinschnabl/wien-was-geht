<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b281b"/>
      <stop offset="100%" stop-color="#121a12"/>
    </linearGradient>

    <!-- Pin Body Gradient: Otto Wagner Resedagrün -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b8250"/>
      <stop offset="50%" stop-color="#2e6f40"/>
      <stop offset="100%" stop-color="#1e4d2b"/>
    </linearGradient>

    <!-- Golden Rim Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae892"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b20"/>
    </linearGradient>

    <!-- Emerald Live Pulse Core -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Solid Background (iOS applies its own squircle mask) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Geometric Map Pin Silhouette -->
  <g filter="url(#pinShadow)">
    <!-- Outer Pin Shape -->
    <path d="M256 64 C175.37 64 110 129.37 110 210 C110 300 236 434 246.5 445 C251.5 450.5 260.5 450.5 265.5 445 C276 434 402 300 402 210 C402 129.37 336.63 64 256 64 Z"
          fill="url(#pinGrad)"
          stroke="url(#goldGrad)"
          stroke-width="12"
          stroke-linejoin="round"/>

    <!-- Concentric Golden Inner Ring -->
    <circle cx="256" cy="208" r="82" fill="#131e13" stroke="url(#goldGrad)" stroke-width="10"/>

    <!-- Concentric Radar Pulse Ring -->
    <circle cx="256" cy="208" r="54" fill="none" stroke="url(#pulseGrad)" stroke-width="8" stroke-dasharray="16 8" opacity="0.85"/>

    <!-- Vibrant Emerald Center Core -->
    <circle cx="256" cy="208" r="32" fill="url(#pulseGrad)"/>

    <!-- Center Light Glint / Flare -->
    <circle cx="248" cy="200" r="10" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
